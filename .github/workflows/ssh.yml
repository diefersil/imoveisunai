on:
  push:
    branches:
      - main

name: 🚀 Deploy Plugins SSH

jobs:
  deploy-plugins:
    name: 🔌 Deploy Plugins
    runs-on: ubuntu-latest

    timeout-minutes: 120
    

    env:
      SSH_HOST: imoveisunai.com.br
      SSH_USER: guiaun34
      SSH_PORT: 2222
      REMOTE_DIR: /home4/guiaun34/imoveisunai.com.br/imu/wp-content/plugins
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

    steps:

      # ==================================================
      # 1. BAIXAR REPOSITÓRIO
      # ==================================================
      - name: 🚚 Get latest code
        uses: actions/checkout@v4


      # ==================================================
      # 2. INSTALAR RSYNC + SSHPASS
      # ==================================================
      - name: 📦 Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass


      # ==================================================
      # 3. ADICIONAR SERVIDOR AOS KNOWN HOSTS
      # ==================================================
      - name: 🔐 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts


      # ==================================================
      # 4. TESTAR CONEXÃO POR SENHA
      # ==================================================
      - name: 🔎 Testar SSH
        run: |
          sshpass -p "$SSH_PASSWORD" \
          ssh \
            -p "$SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=30 \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH conectado com sucesso'"


      # ==================================================
      # 5. GARANTIR DIRETÓRIO DE PLUGINS
      # ==================================================
      - name: 📁 Preparar diretório remoto
        run: |
          sshpass -p "$SSH_PASSWORD" \
          ssh \
            -p "$SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_DIR'"


      # ==================================================
      # 6. DEPLOY SOMENTE PLUGINS
      # ==================================================
      - name: 🔌 Deploy Plugins
        if: ${{ hashFiles('wp-content/plugins/**') != '' }}
        run: |
          sshpass -p "$SSH_PASSWORD" \
          rsync \
            -az \
            --partial \
            --timeout=300 \
            --info=progress2 \
            --stats \
            -e "ssh \
              -p $SSH_PORT \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10" \
            ./wp-content/plugins/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"


      # ==================================================
      # 7. FINAL
      # ==================================================
      - name: ✅ Deploy concluído
        run: |
          echo "======================================"
          echo "DEPLOY DE PLUGINS CONCLUÍDO"
          echo "======================================"