on:
  push:
    branches:
      - main

name: 🚀 Deploy WordPress SSH

jobs:
  web-deploy:
    name: 🎉 Deploy WordPress
    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:
      SSH_HOST: imoveisunai.com.br
      SSH_USER: guiaun34
      SSH_PORT: 2222

      REMOTE_ROOT: /home4/guiaun34/imoveisunai.com.br/imu

      # Senha armazenada no GitHub Secrets
      SSHPASS: ${{ secrets.SSH_PASSWORD }}

    steps:

      # ==================================================
      # 1. BAIXAR REPOSITÓRIO
      # ==================================================
      - name: 🚚 Get latest code
        uses: actions/checkout@v4


      # ==================================================
      # 2. INSTALAR DEPENDÊNCIAS
      # ==================================================
      - name: 📦 Instalar Rsync + SSHPass
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass openssh-client


      # ==================================================
      # 3. CONFIGURAR SSH
      # ==================================================
      - name: 🔐 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts


      # ==================================================
      # 4. TESTAR CONEXÃO SSH
      # ==================================================
      - name: 🔎 Testar conexão SSH
        run: |
          sshpass -e \
          ssh \
            -p "$SSH_PORT" \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=keyboard-interactive,password \
            -o KbdInteractiveAuthentication=yes \
            -o PasswordAuthentication=yes \
            -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH conectado com sucesso'"


      # ==================================================
      # 5. CRIAR DIRETÓRIOS REMOTOS
      # ==================================================
      - name: 📁 Preparar diretórios remotos
        run: |
          sshpass -e \
          ssh \
            -p "$SSH_PORT" \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=keyboard-interactive,password \
            -o KbdInteractiveAuthentication=yes \
            -o PasswordAuthentication=yes \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p \
              '$REMOTE_ROOT' \
              '$REMOTE_ROOT/wp-admin' \
              '$REMOTE_ROOT/wp-includes' \
              '$REMOTE_ROOT/wp-content' \
              '$REMOTE_ROOT/wp-content/themes' \
              '$REMOTE_ROOT/wp-content/languages' \
              '$REMOTE_ROOT/wp-content/mu-plugins' \
              '$REMOTE_ROOT/wp-content/plugins'"


      # ==================================================
      # 6. PREPARAR ARQUIVOS DA RAIZ
      # ==================================================
      - name: 📦 Preparar Root
        run: |
          rm -rf deploy-root

          mkdir -p deploy-root

          # Enviar arquivos wp-*.php
          # EXCETO wp-config.php
          for file in wp-*.php; do

            if [ -f "$file" ] && [ "$file" != "wp-config.php" ]; then
              cp "$file" deploy-root/
            fi

          done

          # index.php da raiz
          if [ -f "index.php" ]; then
            cp index.php deploy-root/
          fi

          # wp-content/index.php
          if [ -f "wp-content/index.php" ]; then

            mkdir -p deploy-root/wp-content

            cp \
              wp-content/index.php \
              deploy-root/wp-content/

          fi

          echo "======================================"
          echo "ROOT PREPARADO"
          echo "======================================"

          find deploy-root -type f | sort


      # ==================================================
      # 7. DEPLOY ROOT
      # ==================================================
      - name: 📄 Deploy Root
        run: |
          sshpass -e \
          rsync \
            -az \
            --partial \
            --timeout=300 \
            --info=progress2 \
            --stats \
            -e "ssh \
              -p $SSH_PORT \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=keyboard-interactive,password \
              -o KbdInteractiveAuthentication=yes \
              -o PasswordAuthentication=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10" \
            ./deploy-root/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/"


      # ==================================================
      # 8. DEPLOY WP-ADMIN
      # ==================================================
      - name: 🛠️ Deploy WP Admin
        run: |
          sshpass -e \
          rsync \
            -az \
            --partial \
            --timeout=300 \
            --info=progress2 \
            --stats \
            -e "ssh \
              -p $SSH_PORT \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=keyboard-interactive,password \
              -o KbdInteractiveAuthentication=yes \
              -o PasswordAuthentication=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10" \
            ./wp-admin/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/wp-admin/"


      # ==================================================
      # 9. DEPLOY THEMES
      # ==================================================
      - name: 🎨 Deploy Themes
        if: ${{ hashFiles('wp-content/themes/**') != '' }}
        run: |
          sshpass -e \
          rsync \
            -az \
            --partial \
            --timeout=300 \
            --info=progress2 \
            --stats \
            -e "ssh \
              -p $SSH_PORT \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=keyboard-interactive,password \
              -o KbdInteractiveAuthentication=yes \
              -o PasswordAuthentication=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10" \
            ./wp-content/themes/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/wp-content/themes/"


      # ==================================================
      # 10. DEPLOY LANGUAGES
      # ==================================================
      - name: 🌎 Deploy Languages
        if: ${{ hashFiles('wp-content/languages/**') != '' }}
        run: |
          sshpass -e \
          rsync \
            -az \
            --partial \
            --timeout=300 \
            --info=progress2 \
            --stats \
            -e "ssh \
              -p $SSH_PORT \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=keyboard-interactive,password \
              -o KbdInteractiveAuthentication=yes \
              -o PasswordAuthentication=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10" \
            ./wp-content/languages/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/wp-content/languages/"


      # ==================================================
      # 11. DEPLOY MU-PLUGINS
      # ==================================================
      - name: ⚙️ Deploy MU Plugins
        if: ${{ hashFiles('wp-content/mu-plugins/**') != '' }}
        run: |
          sshpass -e \
          rsync \
            -az \
            --partial \
            --timeout=300 \
            --info=progress2 \
            --stats \
            -e "ssh \
              -p $SSH_PORT \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=keyboard-interactive,password \
              -o KbdInteractiveAuthentication=yes \
              -o PasswordAuthentication=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10" \
            ./wp-content/mu-plugins/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/wp-content/mu-plugins/"


      # ==================================================
      # 12. DEPLOY WP-INCLUDES - PENÚLTIMO
      # ==================================================
      - name: ⚙️ Deploy WP Includes
        run: |
          sshpass -e \
          rsync \
            -az \
            --partial \
            --timeout=300 \
            --info=progress2 \
            --stats \
            -e "ssh \
              -p $SSH_PORT \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=keyboard-interactive,password \
              -o KbdInteractiveAuthentication=yes \
              -o PasswordAuthentication=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10" \
            ./wp-includes/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/wp-includes/"


      # ==================================================
      # 13. DEPLOY PLUGINS - ÚLTIMO
      # ==================================================
      - name: 🔌 Deploy Plugins
        if: ${{ hashFiles('wp-content/plugins/**') != '' }}
        run: |
          sshpass -e \
          rsync \
            -az \
            --partial \
            --timeout=300 \
            --info=progress2 \
            --stats \
            -e "ssh \
              -p $SSH_PORT \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=keyboard-interactive,password \
              -o KbdInteractiveAuthentication=yes \
              -o PasswordAuthentication=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10" \
            ./wp-content/plugins/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/wp-content/plugins/"


      # ==================================================
      # 14. FINALIZAÇÃO
      # ==================================================
      - name: ✅ Deploy concluído
        run: |
          echo "======================================"
          echo "DEPLOY WORDPRESS CONCLUÍDO"
          echo "======================================"