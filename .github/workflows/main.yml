on:
  push:
    branches:
      - main

name: 🚀 Deploy WordPress

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. BAIXAR O REPOSITÓRIO
      # ==========================================
      - name: 🚚 Get latest code
        uses: actions/checkout@v4


      # ==========================================
      # 2. PREPARAR CORE WORDPRESS
      # ==========================================
      - name: 📦 Preparar Core
        run: |
          rm -rf deploy-core
          mkdir -p deploy-core

          # Pastas principais do WordPress
          if [ -d "wp-admin" ]; then
            cp -a wp-admin deploy-core/
          fi

          if [ -d "wp-includes" ]; then
            cp -a wp-includes deploy-core/
          fi

          # Arquivos wp-*.php
          # wp-config.php NÃO será enviado
          for file in wp-*.php; do
            if [ -f "$file" ] && [ "$file" != "wp-config.php" ]; then
              cp "$file" deploy-core/
            fi
          done

          # index.php da raiz
          if [ -f "index.php" ]; then
            cp index.php deploy-core/
          fi

          # wp-content/index.php
          if [ -f "wp-content/index.php" ]; then
            mkdir -p deploy-core/wp-content
            cp wp-content/index.php deploy-core/wp-content/
          fi

          echo "======================================"
          echo "CORE PREPARADO"
          echo "======================================"
          du -sh deploy-core
          find deploy-core -maxdepth 2 -type d | sort


      # ==========================================
      # 3. DEPLOY CORE
      # ==========================================
      - name: 🚀 Deploy Core
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./deploy-core/
          server-dir: /imoveisunai.com.br/imu/

          state-name: .ftp-deploy-core.json


      # ==========================================
      # 4. DEPLOY PLUGINS
      # ==========================================
      - name: 🔌 Deploy Plugins
        if: ${{ hashFiles('wp-content/plugins/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./wp-content/plugins/
          server-dir: /imoveisunai.com.br/imu/wp-content/plugins/

          state-name: .ftp-deploy-plugins.json


      # ==========================================
      # 5. DEPLOY THEMES
      # ==========================================
      - name: 🎨 Deploy Themes
        if: ${{ hashFiles('wp-content/themes/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./wp-content/themes/
          server-dir: /imoveisunai.com.br/imu/wp-content/themes/

          state-name: .ftp-deploy-themes.json


      # ==========================================
      # 6. DEPLOY LANGUAGES
      # ==========================================
      - name: 🌎 Deploy Languages
        if: ${{ hashFiles('wp-content/languages/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./wp-content/languages/
          server-dir: /imoveisunai.com.br/imu/wp-content/languages/

          state-name: .ftp-deploy-languages.json


      # ==========================================
      # 7. DEPLOY MU-PLUGINS
      # ==========================================
      - name: ⚙️ Deploy MU Plugins
        if: ${{ hashFiles('wp-content/mu-plugins/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./wp-content/mu-plugins/
          server-dir: /imoveisunai.com.br/imu/wp-content/mu-plugins/

          state-name: .ftp-deploy-mu-plugins.json