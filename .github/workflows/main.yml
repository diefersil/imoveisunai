on:
  push:
    branches:
      - main

name: 🚀 Deploy WordPress

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ==================================================
      # 1. BAIXAR REPOSITÓRIO
      # ==================================================
      - name: 🚚 Get latest code
        uses: actions/checkout@v4


      # ==================================================
      # 2. PREPARAR ARQUIVOS DA RAIZ
      # ==================================================
      - name: 📦 Preparar Root
        run: |
          rm -rf deploy-root
          mkdir -p deploy-root

          for file in wp-*.php; do
            if [ -f "$file" ] && [ "$file" != "wp-config.php" ]; then
              cp "$file" deploy-root/
            fi
          done

          if [ -f "index.php" ]; then
            cp index.php deploy-root/
          fi

          if [ -f "wp-content/index.php" ]; then
            mkdir -p deploy-root/wp-content
            cp wp-content/index.php deploy-root/wp-content/
          fi

          echo "======================================"
          echo "ROOT PREPARADO"
          echo "======================================"

          find deploy-root -type f | sort


      # ==================================================
      # 3. DEPLOY ROOT
      # ==================================================
      - name: 📄 Deploy Root
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./deploy-root/
          server-dir: /imoveisunai.com.br/imu/

          state-name: .ftp-deploy-root.json
          timeout: 190000


      # ==================================================
      # 4. DEPLOY WP-ADMIN
      # ==================================================
      - name: 🛠️ Deploy WP Admin
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./wp-admin/
          server-dir: /imoveisunai.com.br/imu/wp-admin/

          state-name: .ftp-deploy-wp-admin.json
          timeout: 190000


      # ==================================================
      # 5. DEPLOY THEMES
      # ==================================================
      - name: 🎨 Deploy Themes
        if: ${{ hashFiles('wp-content/themes/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./wp-content/themes/
          server-dir: /imoveisunai.com.br/imu/wp-content/themes/

          state-name: .ftp-deploy-themes.json
          timeout: 190000


      # ==================================================
      # 6. DEPLOY LANGUAGES
      # ==================================================
      - name: 🌎 Deploy Languages
        if: ${{ hashFiles('wp-content/languages/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./wp-content/languages/
          server-dir: /imoveisunai.com.br/imu/wp-content/languages/

          state-name: .ftp-deploy-languages.json
          timeout: 190000


      # ==================================================
      # 7. DEPLOY MU-PLUGINS
      # ==================================================
      - name: ⚙️ Deploy MU Plugins
        if: ${{ hashFiles('wp-content/mu-plugins/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./wp-content/mu-plugins/
          server-dir: /imoveisunai.com.br/imu/wp-content/mu-plugins/

          state-name: .ftp-deploy-mu-plugins.json
          timeout: 190000


      # ==================================================
      # 8. DEPLOY WP-INCLUDES - PENÚLTIMO
      # ==================================================
      - name: ⚙️ Deploy WP Includes
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./wp-includes/
          server-dir: /imoveisunai.com.br/imu/wp-includes/

          state-name: .ftp-deploy-wp-includes.json
          timeout: 190000


      # ==================================================
      # 9. DEPLOY PLUGINS - ÚLTIMO
      # ==================================================
      - name: 🔌 Deploy Plugins
        if: ${{ hashFiles('wp-content/plugins/**') != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}

          local-dir: ./wp-content/plugins/
          server-dir: /imoveisunai.com.br/imu/wp-content/plugins/

          state-name: .ftp-deploy-plugins.json
          timeout: 190000